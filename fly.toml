# Fly.io app configuration. See https://fly.io/docs/reference/configuration/
#
# CHANGE THIS NAME. Fly app names are globally unique across every Fly account —
# the name becomes <app>.fly.dev — so short generic ones are long since taken.
# Deploying to a name someone else owns fails with a misleading error:
#
#   error listing active machines: failed to list VMs: unauthorized
#
# That is not a login problem. It means the app exists and is not yours.
# `fly launch` picks a free name for you and rewrites this line; see the README.
app = "movie-api-changeme"
primary_region = "syd"

[build]

# Only settings that are the same on every deploy belong here — this file is
# committed, and changing it means a commit and a rebuild.
#
# CORS_ORIGIN is deliberately NOT here: it differs per environment and changes
# whenever the frontend moves. `fly secrets set CORS_ORIGIN=...` sets it at
# runtime, with no code change and no redeploy. Same for JWT_SECRET, which
# additionally must never be committed. See the README.
[env]
  PORT = "3000"
  NODE_ENV = "production"
  # The volume mounted below. better-sqlite3 needs the database file itself
  # to live on it, or every deploy starts from an empty catalogue again.
  SQLITE_FILE = "/data/movies.db"

[mounts]
  source = "movie_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"
